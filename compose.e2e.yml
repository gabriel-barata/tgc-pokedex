name: tcg-pokedex-e2e

services:
  app:
    image: tcg-pokedex:e2e
    build: .
    environment:
      TCG_POKEDEX_DATABASE_URL: postgresql+psycopg://tcg_pokedex:tcg_pokedex@postgres:5432/tcg_pokedex
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tcg_pokedex
      POSTGRES_PASSWORD: tcg_pokedex
      POSTGRES_DB: tcg_pokedex
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg_pokedex -d tcg_pokedex"]
      interval: 2s
      timeout: 5s
      retries: 15
