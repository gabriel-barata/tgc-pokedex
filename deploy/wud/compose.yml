name: wud

services:
  wud:
    image: getwud/wud:9.4.1
    container_name: wud
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      WUD_AUTH_ADMIN_USER: ${WUD_ADMIN_USER:-admin}
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_ADMIN_PASSWORD:?set WUD_ADMIN_PASSWORD in .env}
      WUD_WATCHER_LOCAL_CRON: "*/5 * * * *"
      WUD_TRIGGER_DOCKER_AUTOUPDATE_INCLUDEBYDEFAULT: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-store:/store

networks:
  default:
    external: true
    name: servicos_lan

volumes:
  wud-store:
