name: wud

services:
  wud:
    image: getwud/wud:9.4.1
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      WUD_AUTH_ADMIN_USER: ${WUD_ADMIN_USER:-admin}
      WUD_AUTH_ADMIN_PASSWORD: ${WUD_ADMIN_PASSWORD:?set WUD_ADMIN_PASSWORD in .env}
      WUD_WATCHER_LOCAL_CRON: "*/5 * * * *"
      WUD_TRIGGER_DOCKER_AUTOUPDATE_INCLUDEBYDEFAULT: "false"
      WUD_TRIGGER_NTFY_DEPLOY_URL: ${NTFY_URL:-https://ntfy.sh}
      WUD_TRIGGER_NTFY_DEPLOY_TOPIC: ${NTFY_TOPIC:?set NTFY_TOPIC in .env}
      WUD_TRIGGER_NTFY_DEPLOY_AUTO: "false"
      WUD_TRIGGER_NTFY_DEPLOY_TAGS: whale
      WUD_TRIGGER_NTFY_DEPLOY_SIMPLETITLE: "$${container.result.hook.phase === 'failure' ? 'Deploy FAILED for' : 'Deployed'} $${container.displayName}"
      WUD_TRIGGER_NTFY_DEPLOY_SIMPLEBODY: "$${container.result.hook.phase === 'failure' ? 'Could not update to ' + container.updateKind.remoteValue + ', check the WUD logs' : 'Now running ' + container.updateKind.remoteValue}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wud-store:/store
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env}

volumes:
  wud-store:
