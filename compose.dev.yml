name: tcg-pokedex-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tcg_pokedex
      POSTGRES_PASSWORD: tcg_pokedex
      POSTGRES_DB: tcg_pokedex
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcg_pokedex -d tcg_pokedex"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
